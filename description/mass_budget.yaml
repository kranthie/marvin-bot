# Mass budget for everything except the motors listed in robot.yaml (those are summed from
# actuators.yaml by tools/check_description.py). Values in kg.
# basis: estimate = engineering guess, to be replaced by CAD-computed (cad) and then weighed (weighed).

items:
  leg_structure:     {mass: 4.6221, basis: cad, note: "two legs, cad/leg.py second pass: far-side bearings at knee and hip roll, channel-flanged hip block, pocketed plates; passes cad/strength.py; no fasteners yet"}
  feet:              {mass: 1.1752, basis: cad, note: "two feet, cad/leg.py: 5 mm pocketed base with two 6 x 16 mm ribs, heel posts, roll-bearing lugs, 4 mm TPU sole"}
  pelvis:            {mass: 1.0238, basis: cad, note: "cad/torso.py: box frame of side, front, back and top plates, pocketed"}
  torso:             {mass: 1.2889, basis: cad, note: "cad/torso.py: waist flange, base plate, two uprights (service-cut), neck bridge, printed chest shell"}
  arm_structure:     {mass: 1.6256, basis: cad, note: "two arms, cad/arm.py: two-plate shoulder brackets, 7 mm shoulder plates, aluminium motor rings and flanges, printed upper-arm and forearm shells, wrist pitch cradles and hand mounts; no fasteners yet"}
  hands:             {mass: 0.80, basis: datasheet, note: "two bought 8-servo four-finger hands (bom.csv), 0.40 kg each as published, placed by cad/arm.py from their published CAD; to be weighed. Their mounts are in arm_structure"}
  head:              {mass: 0.4349, basis: cad, note: "cad/head.py: neck bracket, printed head frame, helmet shell, visor and camera window, depth camera (0.133 kg)"}
  compute:           {mass: 1.5, basis: estimate, note: "Jetson AGX Orin developer kit as shipped; to be weighed"}
  battery:           {mass: 3.4, basis: estimate, note: "13S3P 21700 pack with BMS and housing, ~630 Wh"}
  keep_alive:        {mass: 0.4, basis: estimate, note: "50-100 Wh battery for the computer during swaps"}
  electronics:       {mass: 1.4700, basis: cad, note: "cad/electrical.py: each part placed at a typical outline with an estimated mass, plus harness allowances; weigh as bought"}
  padding:           {mass: 0.3, basis: estimate, note: "fall padding at knees, hips, elbows"}

# Ideas to bring the total back under the target, with rough savings (kg).
reductions:
  - {idea: "Orin module on a compact carrier board instead of the developer kit", saving: 1.0}
  - {idea: "Lighter leg cores once CAD and simulation give real loads", saving: 0.5}
