# Marvin Bot: single source of truth for joints, sizes, motors and CAN buses.
# Concept v0.2 (2026-10-25). Lengths in m; joint ranges in degrees (anatomical, see below).
# Entries containing "{side}" are expanded for left and right by tools/check_description.py.
#
# Range convention (left side; the URDF assigns axis signs):
#   pitch: + = flexion (thigh or arm forward, knee bend, toes up at the ankle)
#   roll:  + = abduction (limb away from the midline)
#   yaw:   + = rotation towards the midline (toes or hand turning in)
#   neck pitch: + = looking down

robot:
  name: marvin_bot
  version: "0.2"
  height: 1.438           # sole to the top of the head, standing straight
  mass_target_kg: 35.0
  mass_limit_kg: 42.0     # the full robot: hands and the add-on body shells included

dimensions:
  hip_axis_height: 0.700   # hip pitch axis to sole (49% of height)
  thigh: 0.325             # hip pitch axis to knee axis
  shin: 0.315              # knee axis to ankle axis
  ankle_height: 0.060      # ankle axis to sole
  hip_spacing: 0.200       # between left and right leg lines
  shoulder_width: 0.416    # outside of the shoulder actuators
  shoulder_height: 1.165   # shoulder pitch axis above the floor
  upper_arm: 0.200         # shoulder roll axis to elbow axis
  forearm: 0.188           # elbow axis to wrist pitch axis (a person's at this height: ~0.19)
  hand: 0.181              # wrist pitch axis to fingertips, the bought hand on its mount
  foot_length: 0.240
  foot_width: 0.110

# Default stance (degrees, robot.yaml convention, same values on both sides): the pose the
# walking policies act around and the robot starts from. Pelvis 0.694 m above the floor in it.
# Knee 15° (was 25°: the policies walked and climbed in a crouch); hip and ankle pitch keep
# the foot flat and the CoM over the feet (CoM 106 mm inside the feet, tilt 0.1° standing).
stance: {hip_pitch: 6, knee: 15, ankle_pitch: 9, shoulder_roll: 8, elbow: 20}
stance_pelvis_height: 0.694

joints:
  # legs, pelvis outwards: the hip is roll, then pitch, then yaw (skeleton.yaml); listed here
  # in the order the policies use
  - {name: "{side}_hip_pitch",      axis: pitch, range: [-30, 120]}  # beyond -30° (extension) the hip pitch yoke meets the hip roll motor behind it (cad.covers --check)
  - {name: "{side}_hip_roll",       axis: roll,  range: [-30, 45]}
  - {name: "{side}_hip_yaw",        axis: yaw,   range: [-90, 90]}
  - {name: "{side}_knee",           axis: pitch, range: [0, 130]}  # beyond 130° the upper ankle motor meets the thigh shell (cad.covers --check)
  - {name: "{side}_ankle_pitch",    axis: pitch, range: [-40, 40]}  # 40° dorsiflexion: 17-20 cm stairs (check_step_up.py)
  - {name: "{side}_ankle_roll",     axis: roll,  range: [-20, 20]}
  # torso and head
  - {name: waist_yaw,               axis: yaw,   range: [-150, 150]}
  - {name: neck_yaw,                axis: yaw,   range: [-60, 60]}
  - {name: neck_pitch,              axis: pitch, range: [-20, 40]}
  # arms
  - {name: "{side}_shoulder_pitch", axis: pitch, range: [-60, 180]}
  - {name: "{side}_shoulder_roll",  axis: roll,  range: [0, 120]}  # with the arms close to the body, below 0° the forearm meets the hip motor (check_packaging.py)
  - {name: "{side}_shoulder_yaw",   axis: yaw,   range: [-150, 150]}
  - {name: "{side}_elbow",          axis: pitch, range: [0, 135]}
  - {name: "{side}_wrist_yaw",      axis: yaw,   range: [-90, 90]}
  - {name: "{side}_wrist_pitch",    axis: pitch, range: [-60, 60]}  # carries the hand (description/mass_budget.yaml: hands)

# Each motor drives one joint directly, or two motors drive a pair of joints through a linkage.
# output: the direction its output face looks, in the frame of the link carrying it (left side;
# mirrored for the right); for servos, length: the direction its case's long side runs.
motors:
  - {name: "{side}_hip_pitch",      model: RS04,    bus: "{side}_hip",   drives: ["{side}_hip_pitch"], output: [0, 1, 0]}
  - {name: "{side}_hip_roll",       model: RS04,    bus: "{side}_hip",   drives: ["{side}_hip_roll"], output: [1, 0, 0]}
  - {name: "{side}_hip_yaw",        model: RS03,    bus: "{side}_hip",   drives: ["{side}_hip_yaw"], output: [0, 0, -1]}
  - {name: "{side}_knee",           model: RS04,    bus: "{side}_shank", drives: ["{side}_knee"], output: [0, -1, 0]}
  # two calf-mounted motors driving ankle pitch and roll through push rods (parallel linkage)
  - {name: "{side}_ankle_a",        model: RS03,    bus: "{side}_shank", drives: ["{side}_ankle_pitch", "{side}_ankle_roll"], output: [0, 1, 0]}
  - {name: "{side}_ankle_b",        model: RS03,    bus: "{side}_shank", drives: ["{side}_ankle_pitch", "{side}_ankle_roll"], output: [0, -1, 0]}
  - {name: waist_yaw,               model: RS03,    bus: right_arm,      drives: [waist_yaw], output: [0, 0, 1]}
  - {name: "{side}_shoulder_pitch", model: RS03,    bus: "{side}_arm",   drives: ["{side}_shoulder_pitch"], output: [0, 1, 0]}
  - {name: "{side}_shoulder_roll",  model: RS03,    bus: "{side}_arm",   drives: ["{side}_shoulder_roll"], output: [1, 0, 0]}
  - {name: "{side}_shoulder_yaw",   model: RS06,    bus: "{side}_arm",   drives: ["{side}_shoulder_yaw"], output: [0, 0, -1]}
  - {name: "{side}_elbow",          model: RS06,    bus: "{side}_arm",   drives: ["{side}_elbow"], output: [0, 1, 0]}
  - {name: "{side}_wrist_yaw",      model: RS00,    bus: "{side}_arm",   drives: ["{side}_wrist_yaw"], output: [0, 0, -1]}
  - {name: neck_yaw,                model: STS3250, bus: servo,          drives: [neck_yaw], output: [0, 0, 1], length: [1, 0, 0]}
  - {name: neck_pitch,              model: STS3250, bus: servo,          drives: [neck_pitch], output: [0, 1, 0], length: [0, 0, -1]}
  - {name: "{side}_wrist_pitch",    model: STS3250, bus: servo,          drives: ["{side}_wrist_pitch"], output: [0, 1, 0], length: [0, 0, 1]}

# Classic CAN 2.0B at 1 Mbit/s (Robstride uses 29-bit identifiers). Each motor exchanges one
# command and one reply frame per control cycle. Load is kept at or below max_load.
can:
  bitrate: 1000000
  bits_per_frame: 150        # 29-bit ID, 8 data bytes, worst-case bit stuffing
  frames_per_motor_cycle: 2
  max_load: 0.6
  buses:
    "{side}_hip":   {type: can, rate_hz: 500}
    "{side}_shank": {type: can, rate_hz: 500}
    "{side}_arm":   {type: can, rate_hz: 250}
    battery:        {type: can, rate_hz: 10, note: "BMS telemetry, no motors"}
    servo:          {type: serial, note: "Feetech serial bus, 12 V"}
