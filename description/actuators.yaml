  torque_constant: 1.09
  voltage: [15, 60]
  interface: can
  protocols: [robstride, mit]
  envelope_mm: [85, 82, 50.5]  # RobStride STEP model (re-measured 2026-10-26); a lug reaches Ø90 at one point
  verified: manual

RS00:
