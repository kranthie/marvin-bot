# Actuator specifications. SI units. "verified: manual" means taken from the manufacturer's
# manual or specification sheet; "reseller" means not yet confirmed by the manufacturer.
# Rated torques for Robstride depend on the aluminium heat sink the manual tests with.
#
# Sources:
#   Robstride: https://github.com/RobStride/Product_Information (manuals revised 2025-11 to
#              2026-10, specification README dated 2026-07-13; envelopes measured from the
#              STEP models, fetched locally by tools/fetch_vendor_cad.py)
#   Feetech STS3250: manufacturer datasheet (ST-3250-C001)

RS04:
  vendor: RobStride
  peak_torque: 120.0          # N·m, at 90 A peak phase current
  rated_torque: 40.0          # N·m with a 345 x 345 mm heat sink; 35 N·m with 220 x 200 mm
  no_load_speed_rpm: 200
  gear_ratio: 9
  mass: 1.42                  # kg
  torque_constant: 2.1        # N·m/A rms
  voltage: [24, 60]           # V; manual 24-60, specification README 15-60
  interface: can
  protocols: [robstride, mit, canopen]
  envelope_mm: [120, 120, 55.7]  # RobStride STEP model (tools/fetch_vendor_cad.py)
  # Outline (RobStride drawing, manual §1.1, and STEP model): a Ø120 body with the output on its
  # front face, and a Ø94 driver cap (cable exit) standing 13.2 mm proud of the rear face.
  shape: {body_d: 120, cap_d: 94, cap_len: 13.2, output_d: 42}
  holes:   # mm; stator holes on both body faces (front: blind 5 deep; rear: 6 deep); the front
    # face is 3.5 mm behind the output face
    stator: {n: 10, thread: M4, pcd: 106, face: both, setback: 3.5}
    output: {n: 9, thread: M5, pcd: 36, pins: {n: 2, d: 5, pcd: 35.86}}
  verified: manual

RS03:
  vendor: RobStride
  peak_torque: 60.0           # at 43 A
  rated_torque: 20.0          # 215 x 220 mm heat sink; README says 21
  no_load_speed_rpm: 195      # README; manual says 200
  gear_ratio: 9
  mass: 0.90                  # README; manual says 0.88
  torque_constant: 2.36
  voltage: [24, 60]
  interface: can
  protocols: [robstride, mit]
  envelope_mm: [100, 99, 56.6]  # RobStride STEP model (re-measured 2026-10-26); a lug reaches Ø107 at one point; resellers list 106 x 106 x 56
  # Outline: a Ø98 body with eight mounting ears (to ~Ø107), the output on its front face, and a
  # ~Ø78 driver cap 12.5 mm proud of the rear face (drawing and STEP model).
  shape: {body_d: 100, cap_d: 78, cap_len: 12.5, ears_d: 107, output_d: 70}
  holes:
    # in ears at the output end, 8 deep, their faces 2.5 mm behind the output face; the rear has
    # only 4 tapped holes, in the ears' rear faces 39.5 mm from the output face (drawing, STEP)
    stator: {n: 8, thread: M4, pcd: 98, face: front, setback: 2.5}
    output: {n: 6, thread: M4, pcd: 30.36, pins: {n: 3, d: 4, pcd: 30.36}}
  verified: manual

RS06:
  vendor: RobStride
  peak_torque: 36.0           # at 57 A
  rated_torque: 11.0          # 130 x 160 mm heat sink
  no_load_speed_rpm: 480
  gear_ratio: 9
  mass: 0.621
  torque_constant: 1.09
  voltage: [15, 60]
  interface: can
  protocols: [robstride, mit]
  envelope_mm: [85, 82, 50.5]  # RobStride STEP model (re-measured 2026-10-26); a lug reaches Ø90 at one point
  # Outline: a Ø85 body with ears (to ~Ø88), the output (Ø52 spigot) on its front face, and a
  # Ø70 driver cap ~14 mm proud of the rear face (drawing and STEP model).
  shape: {body_d: 85, cap_d: 70, cap_len: 14.0, ears_d: 88, output_d: 52}
  holes:
    stator: {n: 8, thread: M3, pcd: 82, face: front, setback: 1.5}   # ears at the output end, 8.5 deep
    output: {n: 6, thread: M4, pcd: 30, pins: {n: 3, d: 4, pcd: 24}}   # screw circle read off the drawing, to confirm
  verified: manual

RS00:
  vendor: RobStride
  peak_torque: 14.0           # at 15.5 A
  rated_torque: 5.0           # 90 x 85 mm heat sink
  no_load_speed_rpm: 315
  gear_ratio: 10
  mass: 0.31
  torque_constant: 1.48
  voltage: [24, 60]
  interface: can
  protocols: [robstride, mit]
  envelope_mm: [57, 57, 51.4]  # RobStride STEP model
  # Outline: a plain Ø57 cylinder, the output (Ø35, 1 mm proud) on its front face.
  shape: {body_d: 57, cap_d: null, cap_len: 0, output_d: 35}
  holes:
    stator: {n: 6, thread: M3, pcd: 50, face: front, setback: 1.0}   # front face
    rear: {n: 4, thread: M3, pcd: 38}     # rear face: the wrist's printed cup bolts here
    output: {n: 6, thread: M3, pcd: 27, pins: {n: 2, d: 3, pcd: 24.46}}
  verified: manual

STS3250:
  vendor: Feetech
  peak_torque: 4.9            # stall, at 12 V
  rated_torque: 1.57
  no_load_speed_rpm: 75
  gear_ratio: 345
  mass: 0.0745
  torque_constant: null
  voltage: [9, 12.6]
  interface: serial
  protocols: [feetech_sts]
  envelope_mm: [45.3, 35.8, 24.8]
  # A box servo: the output shaft runs along its 35.8 mm height, 5.8 mm above the case's top face
  # with the spline; the shaft sits 11.5 mm off the case centre along its 45.3 mm length
  # (approximate, from the datasheet outline). Mounting ears at both ends of the length.
  shape: {box: [45.3, 24.8], axial: [-30.0, 5.8], shaft_offset: 11.5}
  verified: manual

