# Marvin Bot skeleton: link frames, where masses sit, and simple collision and visual shapes.
# tools/build_urdf.py turns this, robot.yaml, actuators.yaml and mass_budget.yaml into the URDF.
# Left side and centre only; the right side is mirrored (y negated). SI units.
#
# Frames: x forward, y left, z up. The pelvis frame sits at the hip pitch axes, midway between
# them, at robot.yaml's hip_axis_height above the floor when standing straight.
# The joint offsets must add up to the lengths in robot.yaml (build_urdf.py checks this):
#   thigh = hip roll + hip yaw + knee offsets; shin = ankle pitch offset;
#   upper arm = shoulder yaw + elbow offsets; forearm = wrist yaw + gripper offsets.
#
# Joint axes are chosen so that positive angles follow robot.yaml's range convention
# (pitch + = flexion, roll + = abduction, yaw + = towards the midline); for the right side the
# roll and yaw axes are negated by the mirror.

joints:
  left_hip_pitch:      {parent: pelvis,                  child: left_hip_pitch_link,      xyz: [0, 0.075, 0],       axis: [0, -1, 0]}
  left_hip_roll:       {parent: left_hip_pitch_link,     child: left_hip_roll_link,       xyz: [0, 0.025, -0.085],  axis: [1, 0, 0]}
  left_hip_yaw:        {parent: left_hip_roll_link,      child: left_thigh_link,          xyz: [0, 0, -0.060],      axis: [0, 0, -1]}
  left_knee:           {parent: left_thigh_link,         child: left_shin_link,           xyz: [0, 0, -0.155],      axis: [0, 1, 0]}
  left_ankle_pitch:    {parent: left_shin_link,          child: left_ankle_link,          xyz: [0, 0, -0.290],      axis: [0, -1, 0]}
  left_ankle_roll:     {parent: left_ankle_link,         child: left_foot_link,           xyz: [0, 0, 0],           axis: [1, 0, 0]}
  waist_yaw:           {parent: pelvis,                  child: torso_link,               xyz: [0, 0, 0.115],       axis: [0, 0, 1]}
  neck_yaw:            {parent: torso_link,              child: neck_link,                xyz: [0, 0, 0.290],       axis: [0, 0, 1]}
  neck_pitch:          {parent: neck_link,               child: head_link,                xyz: [0, 0, 0.035],       axis: [0, 1, 0]}
  left_shoulder_pitch: {parent: torso_link,              child: left_shoulder_pitch_link, xyz: [0, 0.140, 0.250],   axis: [0, -1, 0]}
  left_shoulder_roll:  {parent: left_shoulder_pitch_link, child: left_shoulder_roll_link, xyz: [0, 0.048, -0.050],  axis: [1, 0, 0]}
  left_shoulder_yaw:   {parent: left_shoulder_roll_link, child: left_upper_arm_link,      xyz: [0, 0, -0.085],      axis: [0, 0, -1]}
  left_elbow:          {parent: left_upper_arm_link,     child: left_forearm_link,        xyz: [0, 0, -0.115],      axis: [0, -1, 0]}
  left_wrist_yaw:      {parent: left_forearm_link,       child: left_wrist_link,          xyz: [0, 0, -0.125],      axis: [0, 0, -1]}
  left_gripper:        {parent: left_wrist_link,         child: left_gripper_link,        xyz: [0, 0, -0.090],      axis: [0, -1, 0]}

# The ankle's two motors drive pitch and roll through cranks and push rods (tools/ankle_linkage.py).
# Geometry in the shin frame (origin on the ankle axis, x forward, y left, z up), metres; the
# ratios are joint torque per motor torque at the neutral pose, computed by that tool from the
# geometry, and set the URDF's ankle torque limits as (sum of both motors) x ratio.
ankle_linkage:
  # staggered motors on the shin's centre line: a low and just behind the ankle (crank on the
  # outer side), b high and forward, below the knee (crank on the inner side); (x, z) above the
  # ankle axis. Each crank sits outside the side plate opposite its motor's mounting face, so
  # crank_y is the crank plane, not the motor centre
  geometry: {crank_radius: 0.060, crank_tilt: 0.0, motor_a: [-0.010, 0.080], motor_b: [0.040, 0.180], crank_y: 0.041, rod_back: 0.060, rod_side: 0.040, rod_below: 0.010}
  pitch_ratio: 0.99
  roll_ratio: 0.67

# Motor housings sit on the parent link of the joint they drive, at the joint, unless listed here.
motor_mounts:
  # hip roll RS04 behind the hip pitch RS04, along its own (x) axis: at the joint origin they overlap
  left_hip_roll: {link: left_hip_pitch_link, xyz: [-0.090, 0.025, -0.085]}
  # shoulder pitch RS03 pulled into the torso along its axis, clear of the shoulder roll RS03
  left_shoulder_pitch: {link: torso_link, xyz: [0, 0.110, 0.250]}
  # neck yaw servo lowered into the torso top, clear of the head
  neck_yaw: {link: torso_link, xyz: [0, 0, 0.265]}
  # the two ankle RS03 staggered on the shin's centre line (a slim shin): a low, b high and
  # forward like a kneecap (tools/ankle_linkage.py: ankle_linkage geometry, from the ankle)
  left_ankle_a: {link: left_shin_link, xyz: [-0.010, 0, -0.210]}
  left_ankle_b: {link: left_shin_link, xyz: [0.040, 0, -0.110]}

# Structure and equipment, as boxes. "budget" names the mass_budget.yaml item each mass comes
# from; the masses of each item (both sides counted) must add up to the budget figure.
bodies:
  - {link: pelvis,                   budget: pelvis,        mass: 1.00,  xyz: [0, 0, 0.040],       size: [0.14, 0.18, 0.12]}
  - {link: pelvis,                   budget: electronics,   mass: 0.50,  xyz: [0, 0, 0.040],       size: [0.08, 0.07, 0.05]}  # inside the pelvis frame
  - {link: left_hip_pitch_link,      budget: leg_structure, mass: 0.15,  xyz: [0, 0.015, -0.045],  size: [0.08, 0.04, 0.10]}
  - {link: left_hip_roll_link,       budget: leg_structure, mass: 0.15,  xyz: [0, 0, -0.050],      size: [0.08, 0.06, 0.10]}
  - {link: left_thigh_link,          budget: leg_structure, mass: 0.60,  xyz: [0, 0, -0.060],      size: [0.08, 0.08, 0.16]}
  - {link: left_thigh_link,          budget: padding,       mass: 0.05,  xyz: [0.04, 0, -0.100],   size: [0.02, 0.08, 0.06]}
  - {link: left_shin_link,           budget: leg_structure, mass: 0.50,  xyz: [0, 0, -0.140],      size: [0.07, 0.07, 0.24]}
  - {link: left_shin_link,           budget: padding,       mass: 0.05,  xyz: [0.04, 0, -0.030],   size: [0.02, 0.08, 0.06]}
  - {link: left_ankle_link,          budget: leg_structure, mass: 0.10,  xyz: [0, 0, 0],           size: [0.05, 0.05, 0.03]}
  - {link: left_foot_link,           budget: feet,          mass: 0.35,  xyz: [0.030, 0, -0.045],  size: [0.24, 0.11, 0.03]}
  - {link: torso_link,               budget: torso,         mass: 1.80,  xyz: [0, 0, 0.150],       size: [0.16, 0.24, 0.26]}
  - {link: torso_link,               budget: compute,       mass: 1.50,  xyz: [0.025, 0, 0.130],   size: [0.11, 0.11, 0.07]}
  - {link: torso_link,               budget: battery,       mass: 3.40,  xyz: [-0.062, 0, 0.130],  size: [0.06, 0.14, 0.17]}  # on the base plate, behind the computer
  - {link: torso_link,               budget: keep_alive,    mass: 0.40,  xyz: [-0.060, 0, 0.250],  size: [0.05, 0.10, 0.05]}
  - {link: torso_link,               budget: electronics,   mass: 1.00,  xyz: [0.030, 0, 0.215],   size: [0.09, 0.14, 0.05]}
  - {link: head_link,                budget: head,          mass: 0.50,  xyz: [0.010, 0, 0.040],   size: [0.15, 0.16, 0.17]}
  - {link: left_shoulder_pitch_link, budget: arm_structure, mass: 0.05,  xyz: [0, 0.025, -0.020],  size: [0.06, 0.03, 0.06]}
  - {link: left_shoulder_roll_link,  budget: arm_structure, mass: 0.05,  xyz: [0, 0, -0.040],      size: [0.06, 0.06, 0.06]}
  - {link: left_upper_arm_link,      budget: arm_structure, mass: 0.20,  xyz: [0, 0, -0.060],      size: [0.07, 0.07, 0.12]}
  - {link: left_forearm_link,        budget: arm_structure, mass: 0.15,  xyz: [0, 0, -0.065],      size: [0.06, 0.06, 0.12]}
  - {link: left_wrist_link,          budget: arm_structure, mass: 0.05,  xyz: [0, 0, -0.050],      size: [0.05, 0.06, 0.09]}
  - {link: left_forearm_link,        budget: padding,       mass: 0.05,  xyz: [-0.035, 0, -0.010], size: [0.02, 0.06, 0.05]}
  - {link: left_gripper_link,        budget: grippers,      mass: 0.20,  xyz: [0, 0, -0.040],      size: [0.06, 0.08, 0.09]}

# Collision shapes (boxes). Only these touch the floor or each other in simulation.
collisions:
  - {link: pelvis,            xyz: [0, 0, 0.040],      size: [0.14, 0.18, 0.12]}
  - {link: left_thigh_link,   xyz: [0, 0, -0.060],     size: [0.09, 0.09, 0.16]}
  - {link: left_shin_link,    xyz: [0.040, 0, -0.113],  size: [0.11, 0.09, 0.105]}  # upper ankle motor, under the knee
  - {link: left_shin_link,    xyz: [-0.010, 0, -0.213], size: [0.104, 0.09, 0.097]}  # lower ankle motor
  - {link: left_foot_link,    xyz: [0.030, 0, -0.045], size: [0.24, 0.11, 0.03]}
  - {link: torso_link,        xyz: [-0.010, 0, 0.135], size: [0.18, 0.26, 0.25]}  # top 15 mm below the head box
  - {link: head_link,         xyz: [0.002, 0, 0.087],  size: [0.15, 0.16, 0.162]}  # helmet, above the neck cut
  - {link: left_upper_arm_link, xyz: [0, 0, -0.060],   size: [0.08, 0.08, 0.14]}
  - {link: left_forearm_link, xyz: [0, 0, -0.080],     size: [0.07, 0.07, 0.17]}
  - {link: left_gripper_link, xyz: [0, 0, -0.040],     size: [0.06, 0.08, 0.09]}
