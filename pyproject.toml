[project]
name = "marvin-bot"
version = "0.0.1"
description = "A 1.2 m, 25-DOF open humanoid on Robstride actuators and a Jetson AGX Orin"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
bench = ["python-can"]
sketch = ["matplotlib>=3.8", "numpy"]
sim = ["mujoco>=3.3", "numpy", "pillow", "onnxruntime"]
cad = ["manifold3d==3.5.4", "trimesh==5.2.0"]  # pinned: cad_model.yaml must reproduce exactly
hand = ["fast_simplification"]  # tools/build_hand_mesh.py only

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
