name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,sim]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python tools/check_description.py
      - run: python tools/bom_summary.py
      - run: python tools/ankle_linkage.py --check
      - run: python tools/build_urdf.py --check
      - run: python sim/mujoco/check_standing.py
      - run: python sim/mujoco/check_standing.py --pose straight
      - run: python sim/mujoco/check_step_up.py --heights 0.18
