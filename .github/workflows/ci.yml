name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,sim,cad]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q tests
      - run: python -m cad.build --check
      - run: python -m cad.strength --check
      - run: python -m cad.covers --check
      - run: python -m cad.build > /dev/null  # meshes (git-ignored) for the MuJoCo checks
      - run: python tools/check_description.py
      - run: python tools/bom_summary.py
      - run: python tools/ankle_linkage.py --check
      - run: python tools/build_urdf.py --check
      - run: python tools/build_harness.py --check
      - run: python sim/mujoco/check_standing.py
      - run: python sim/mujoco/check_standing.py --pose straight
      - run: python sim/mujoco/check_step_up.py --heights 0.18
      - run: python sim/mujoco/check_symmetry.py
      - run: python tools/check_packaging.py
