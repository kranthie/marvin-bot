name: Pages

# Builds the documentation site (site/) and deploys it to GitHub Pages. The 3-D model is generated from
# the current design on every run, so the home page always matches the description and the code-CAD.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "description/**"
      - "cad/**"
      - "*.md"
      - "sim/*/README.md"
      - "bom/README.md"
      - "bench/README.md"
      - "LICENSES/README.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[cad,hand]"
      - name: Part meshes and the 3-D model data
        run: |
          python -m cad.build > /dev/null
          python site/scripts/build_model.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the site
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build
          npm run check-links
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
